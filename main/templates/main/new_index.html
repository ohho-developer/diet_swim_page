<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wellness Check-in</title>
    <!-- Bootstrap 5 CSS CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }
        .modern-welcome-container {
            text-align: center;
            padding: 3rem;
            background-color: rgba(255, 255, 255, 0.8);
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            backdrop-filter: blur(10px);
            max-width: 90%;
            width: 700px;
        }
        .modern-welcome-container h1 {
            font-size: 3.2rem;
            font-weight: 600;
            color: #2c3e50;
            margin-bottom: 1.5rem;
            letter-spacing: -1px;
        }
        .modern-welcome-container p {
            font-size: 1.05rem;
            color: #576b80;
            max-width: 600px;
            line-height: 1.6;
            margin: 0 auto 2.5rem;
        }
        .cta-button {
            font-size: 1rem;
            font-weight: 600;
            color: #fff;
            background: linear-gradient(135deg, #0152a8 0%, #013d7e 100%);
            padding: 14px 32px;
            border: none;
            border-radius: 50px;
            text-decoration: none;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(1, 82, 168, 0.3);
        }
        .cta-button:hover {
            transform: translateY(-3px);
            box-shadow: 0 7px 20px rgba(1, 82, 168, 0.4);
            color: #fff;
        }
    </style>
</head>
<body>
    <div class="modern-welcome-container">
        <h1>Wellness Check-in</h1>
        <p>왜 나는 살이 안빠질까?<br><br>체중감소에 영향을 미치는<br>당신의 습관을 분석해드립니다.</p>
        <a href="{% url 'wellness_checkin:daily_checkin_input' %}" class="cta-button">지금 시작하기</a>
    </div>
</body>
</html>
